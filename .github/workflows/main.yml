    <div class="callout">
      <p><strong>آخر تحديث:</strong> [التاريخ]</p>
      <p><strong>المتحكم بالبيانات / المطور:</strong> [اسم المطور أو الشركة]</p>
      <p><strong>البريد الإلكتروني للخصوصية:</strong> <a href="mailto:privacy@example.com">privacy@example.com</a></p>
    </div>

    <div class="callout">
      <p><strong>تنبيه:</strong> هذه مسودة عامة وليست نصيحة قانونية. يُنصح بمراجعتها مع محامٍ مختص قبل نشرها في المتاجر.</p>
    </div>

    <!-- PRIVACY -->
    <section id="ar-privacy">
      <h2 class="section-title">سياسة الخصوصية</h2>

      <h3>1. مقدمة</h3>
      <p>صُمم تطبيق <strong>فلك (Falak)</strong> حول مبدأ الخصوصية المحلية أولاً: موادك — ملاحظاتك، مهامك، روابطك، ملفاتك، وتصنيفاتك المدارية — تبقى على جهازك افتراضيًا. لا إعلانات، ولا متتبعات، ولا بيع للبيانات.</p>

      <h3>2. البيانات التي نعالجها</h3>

      <p><strong>أ. المحتوى الذي تدخله:</strong> ملاحظات، مهام، أفكار، روابط، ملفات، مواعيد، وسوم، وتصنيفات. يُخزَّن هذا المحتوى محليًا على جهازك.</p>

      <p><strong>ب. بيانات التشغيل المحلية:</strong> التصنيف المداري (Inner / Middle / Outer)، سبب التصنيف، الخطوة التالية المقترحة، إعدادات التطبيق، وسجل استخدام داخلي. تُعالج محليًا بواسطة المحرك الاستدلالي دون اتصال.</p>

      <p><strong>ج. الذكاء الاصطناعي الاختياري:</strong> إذا فعّلت ربط <strong>Gemini</strong> أو <strong>Groq</strong> أو <strong>Ollama</strong>، فقد يُرسل المحتوى الذي تختاره إلى المزود.</p>
      <ul>
        <li><strong>Ollama المحلي:</strong> لا تغادر بياناتك جهازك/شبكتك المحلية إلا حسب إعداداتك.</li>
        <li><strong>Gemini / Groq:</strong> مزودون خارجيون. قبل أي إرسال، يظهر لك <strong>إفصاح واضح قبل النقل</strong> يوضح: ما البيانات، إلى أين ستُرسل، لماذا، وكيف يمكنك سحب الموافقة. لا يتم الإرسال إلا بموافقتك الصريحة المستنيرة.</li>
        <li>نحن لا نتحكم في سياسات هؤلاء المزودين، ويخضعون لشروطهم وسياسات الخصوصية الخاصة بهم.</li>
      </ul>

      <p><strong>د. الأذونات:</strong> قد يطلب التطبيق إذن التخزين/الملفات لاختيار الملفات، والإنترنت عند تفعيل الذكاء الاصطناعي الخارجي، والإشعارات إن فعّلت التنبيهات. لا نطلب أذونات غير ضرورية.</p>

      <p><strong>هـ. ما لا نجمعه:</strong> لا نجمع الموقع الجغرافي، جهات الاتصال، الكاميرا، الميكروفون، معرّفات الإعلان، سجل التصفح، أو بيانات التتبع. لا نستخدم أدوات تحليل أو إعلانات افتراضيًا.</p>

      <h3>3. كيف نستخدم البيانات</h3>
      <ul>
        <li>تصنيف موادك ووضعها في المدارات المناسبة.</li>
        <li>عرضها في <strong>Orbit Canvas</strong> أو <strong>List View</strong>.</li>
        <li>تنفيذ الأوامر والبحث والتصفية محليًا.</li>
        <li>تحسين الاستقرار والأداء داخل جهازك.</li>
        <li>لا نستخدم محتواك للإعلانات أو لتدريب نماذجنا.</li>
      </ul>

      <h3>4. الذكاء الاصطناعي الاختياري</h3>
      <ul>
        <li>لا يتم تفعيل أي مزود AI خارجي تلقائيًا.</li>
        <li>قبل النقل: إفصاح + موافقة صريحة.</li>
        <li>يمكنك رفض الإرسال، أو استخدام الوضع المحلي فقط، أو سحب الموافقة لاحقًا.</li>
        <li>لا ترسل بيانات حساسة (كلمات مرور، بيانات بنكية، معلومات صحية) إلى مزودين خارجيين.</li>
        <li>قد تتم معالجة البيانات خارج بلدك حسب المزود.</li>
      </ul>

      <h3>5. التخزين والأمان</h3>
      <ul>
        <li>التخزين افتراضيًا محلي على جهازك.</li>
        <li>قد يستفيد التطبيق من تشفير نظام التشغيل.</li>
        <li>إذا فعّلت النسخ الاحتياطي على مستوى النظام، فقد تشمل النسخة بيانات فلك.</li>
        <li>لا يمكن ضمان أمان 100%، لكننا نقلل جمع البيانات إلى الحد الأدنى.</li>
      </ul>

      <h3>6. المشاركة والإفصاح</h3>
      <p>لا نبيع بياناتك. لا نشاركها إلا:</p>
      <ol>
        <li>بموافقتك الصريحة،</li>
        <li>للامتثال لطلب قانوني ملزم،</li>
        <li>مع مزودي الذكاء الاصطناعي الذين تختارهم أنت.</li>
      </ol>
      <p>لا نشارك بياناتك مع معلنين أو وسطاء بيانات.</p>

      <h3>7. الاحتفاظ والحذف</h3>
      <ul>
        <li>عندما تحذف مادة من التطبيق، تُحذف محليًا.</li>
        <li>قد تبقى نسخ في النسخ الاحتياطية للنظام حتى تُستبدل أو تُحذف.</li>
        <li>يمكنك حذف كل بياناتك عبر إلغاء تثبيت التطبيق أو خيار الحذف داخل الإعدادات إن وُجد.</li>
        <li>لحذف أي بيانات شاركتها مع مزود AI خارجي، راجع سياسات ذلك المزود.</li>
      </ul>

      <h3>8. حقوقك</h3>
      <p>حسب موقعك، قد يكون لك حق الوصول، التصحيح، الحذف، سحب الموافقة، الاعتراض، تقييد المعالجة، ونقل البيانات.</p>
      <ul>
        <li><strong>GDPR / UK GDPR:</strong> لك حقوق متقدمة، والأساس القانوني غالبًا الموافقة للـ AI، والمصلحة المشروعة/تنفيذ الخدمة للتشغيل المحلي.</li>
