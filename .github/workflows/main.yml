<button class="back-to-top" id="backToTop" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
  const body = document.body;
  const contentAr = document.getElementById('content-ar');
  const contentEn = document.getElementById('content-en');
  const btnAr = document.getElementById('btn-ar');
  const btnEn = document.getElementById('btn-en');
  const subtitle = document.getElementById('header-subtitle');

  function setLang(lang) {
    if (lang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      contentAr.classList.add('active');
      contentEn.classList.remove('active');
      btnAr.classList.add('active');
      btnEn.classList.remove('active');
      btnAr.setAttribute('aria-selected', 'true');
      btnEn.setAttribute('aria-selected', 'false');
      subtitle.textContent = 'سياسة الخصوصية وشروط الاستخدام — Privacy Policy & Terms of Use';
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      contentEn.classList.add('active');
      contentAr.classList.remove('active');
      btnEn.classList.add('active');
      btnAr.classList.remove('active');
      btnEn.setAttribute('aria-selected', 'true');
      btnAr.setAttribute('aria-selected', 'false');
      subtitle.textContent = 'Privacy Policy & Terms of Use — سياسة الخصوصية وشروط الاستخدام';
    }
    try { localStorage.setItem('falak-lang', lang); } catch (e) {}
  }

  // Restore saved language preference
  try {
    const saved = localStorage.getItem('falak-lang');
    if (saved === 'en' || saved === 'ar') setLang(saved);
  } catch (e) {}

  // Back to top visibility
  const backToTop = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) backToTop.classList.add('visible');
    else backToTop.classList.remove('visible');
  });

  // Year
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

