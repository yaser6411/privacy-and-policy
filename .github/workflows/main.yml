<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فلك — الخصوصية وشروط الاستخدام | Falak — Privacy & Terms</title>
<meta name="description" content="سياسة الخصوصية وشروط استخدام تطبيق فلك — Falak Privacy Policy & Terms of Use" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --slate-dark: #0f2420;
    --slate: #12312a;
    --slate-light: #1a3d34;
    --chalk: #f0efe2;
    --chalk-dim: #c9c8ba;
    --chalk-faint: rgba(240, 239, 226, 0.35);
    --wood: #a97155;
    --wood-dark: #7c4f3a;
    --wood-light: #c89272;
    --accent: #e8c88a;
    --accent-soft: #d4a862;
    --shadow: rgba(0, 0, 0, 0.45);
    --max-width: 900px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Tajawal', 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at top, #1a3d34 0%, #0f2420 60%, #0a1a17 100%);
    color: var(--chalk);
    line-height: 1.85;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Chalkboard dust texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(240, 239, 226, 0.03) 0%, transparent 25%),
      radial-gradient(circle at 80% 70%, rgba(240, 239, 226, 0.02) 0%, transparent 30%),
      radial-gradient(circle at 50% 90%, rgba(240, 239, 226, 0.025) 0%, transparent 35%);
    pointer-events: none;
    z-index: 0;
  }

  /* Wood frame top */
  .wood-frame-top,
  .wood-frame-bottom {
    position: fixed;
    left: 0;
    right: 0;
    height: 14px;
    background:
      linear-gradient(180deg, var(--wood-light) 0%, var(--wood) 40%, var(--wood-dark) 100%);
    box-shadow: 0 4px 20px var(--shadow);
    z-index: 100;
  }
  .wood-frame-top { top: 0; }
  .wood-frame-bottom { bottom: 0; transform: scaleY(-1); }

  .wood-frame-top::after,
  .wood-frame-bottom::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 40px, rgba(0,0,0,0.08) 40px 42px);
    opacity: 0.5;
  }

  .container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 80px 24px 120px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 60px;
    position: relative;
  }

  .orbit-decoration {
    display: inline-block;
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 20px;
  }

  .orbit-decoration svg {
    width: 100%;
    height: 100%;
    animation: slow-spin 60s linear infinite;
  }

  @keyframes slow-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .orbit-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--accent-soft), 0 0 40px rgba(232, 200, 138, 0.4);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px var(--accent-soft), 0 0 40px rgba(232, 200, 138, 0.4); }
    50% { box-shadow: 0 0 30px var(--accent-soft), 0 0 60px rgba(232, 200, 138, 0.6); }
  }

  h1 {
    font-family: 'Amiri', 'Tajawal', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--chalk);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  .tagline {
    font-family: 'Caveat', 'Amiri', cursive;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    color: var(--accent);
    margin: 0 0 24px;
    opacity: 0.95;
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--chalk-dim);
    margin: 0;
  }

  /* Language Toggle */
  .lang-toggle {
    display: flex;
    justify-content: center;
    gap: 0;
    margin: 30px auto 50px;
    width: fit-content;
    border: 1.5px solid var(--chalk-faint);
    border-radius: 999px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.2);
  }

  .lang-toggle button {
    background: transparent;
    border: none;
    color: var(--chalk-dim);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 28px;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.03em;
  }

  .lang-toggle button.active {
    background: var(--accent);
    color: var(--slate-dark);
  }

  .lang-toggle button:hover:not(.active) {
    color: var(--chalk);
    background: rgba(240, 239, 226, 0.08);
  }

  /* Content */
  .lang-content { display: none; }
  .lang-content.active { display: block; animation: fadeIn 0.4s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Table of Contents */
  .toc {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--chalk-faint);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 50px;
    position: relative;
  }

  .toc::before {
    content: "";
    position: absolute;
    top: 12px;
    bottom: 12px;
    inset-inline-start: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent), transparent);
    border-radius: 3px;
  }

  .toc h2 {
    font-family: 'Caveat', 'Amiri', cursive;
    font-size: 1.5rem;
    color: var(--accent);
    margin: 0 0 14px;
    font-weight: 700;
  }

  .toc ol {
    margin: 0;
    padding-inline-start: 20px;
    color: var(--chalk-dim);
    font-size: 0.95rem;
  }

  .toc li { margin-bottom: 6px; }

  .toc a {
    color: var(--chalk-dim);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    transition: all 0.2s ease;
  }

  .toc a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Sections */
  section {
    margin-bottom: 46px;
    scroll-margin-top: 60px;
  }

  h2.section-title {
    font-family: 'Amiri', 'Tajawal', serif;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    color: var(--chalk);
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--chalk-faint);
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 700;
  }

  h2.section-title::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-soft);
    flex-shrink: 0;
  }

  h3 {
    font-family: 'Amiri', 'Tajawal', serif;
    font-size: 1.15rem;
    color: var(--accent);
    margin: 28px 0 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  p {
    color: var(--chalk-dim);
    margin: 0 0 14px;
    font-size: 1rem;
  }

  ul, ol {
    color: var(--chalk-dim);
    padding-inline-start: 24px;
    margin: 0 0 16px;
  }

  li { margin-bottom: 8px; }

  strong {
    color: var(--chalk);
    font-weight: 700;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dashed var(--accent-soft);
    transition: opacity 0.2s ease;
  }

  a:hover { opacity: 0.75; }

  /* Callout / Notice */
  .callout {
    background: rgba(232, 200, 138, 0.08);
    border-inline-start: 4px solid var(--accent);
    border-radius: 0 12px 12px 0;
    padding: 18px 22px;
    margin: 20px 0;
    color: var(--chalk);
    font-size: 0.95rem;
    position: relative;
  }

  [dir="ltr"] .callout {
    border-radius: 12px 0 0 12px;
  }

  .callout::before {
    content: "✎";
    position: absolute;
    top: -12px;
    inset-inline-start: 14px;
    background: var(--slate-dark);
    padding: 0 8px;
    color: var(--accent);
    font-size: 1.1rem;
  }

  .callout p { color: var(--chalk); margin-bottom: 8px; }
  .callout p:last-child { margin-bottom: 0; }

  /* Info card grid for features */
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin: 24px 0;
  }

  .feature-card {
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--chalk-faint);
    border-radius: 14px;
    padding: 18px 20px;
    transition: all 0.25s ease;
  }

  .feature-card:hover {
    border-color: var(--accent-soft);
    background: rgba(232, 200, 138, 0.06);
    transform: translateY(-2px);
  }

  .feature-card h4 {
    font-family: 'Amiri', 'Tajawal', serif;
    color: var(--accent);
    margin: 0 0 8px;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .feature-card p {
    margin: 0;
    font-size: 0.92rem;
    color: var(--chalk-dim);
  }

  /* Contact box */
  .contact-box {
    background: linear-gradient(135deg, rgba(232, 200, 138, 0.12) 0%, rgba(169, 113, 85, 0.12) 100%);
    border: 1.5px solid var(--accent-soft);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    margin: 40px 0;
  }

  .contact-box h3 {
    margin-top: 0;
    font-size: 1.3rem;
    color: var(--accent);
  }

  .contact-box a {
    font-size: 1.05rem;
    font-weight: 600;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 40px 20px 20px;
    border-top: 1px solid var(--chalk-faint);
    margin-top: 60px;
    color: var(--chalk-dim);
    font-size: 0.85rem;
  }

  footer .orbit-quote {
    font-family: 'Caveat', 'Amiri', cursive;
    font-size: 1.3rem;
    color: var(--accent);
    margin-bottom: 10px;
    display: block;
  }

  /* Back to top */
  .back-to-top {
    position: fixed;
    bottom: 40px;
    inset-inline-end: 30px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--slate-dark);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    box-shadow: 0 6px 20px var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 90;
    font-family: inherit;
  }

  .back-to-top.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .back-to-top:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 28px var(--shadow);
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 60px 18px 100px; }
    .toc { padding: 18px 20px; }
    .lang-toggle button { padding: 8px 20px; font-size: 0.85rem; }
    .back-to-top { bottom: 30px; inset-inline-end: 18px; width: 42px; height: 42px; }
  }

  /* Print */
  @media print {
    body { background: white; color: black; }
    .lang-toggle, .back-to-top, .wood-frame-top, .wood-frame-bottom { display: none; }
    .container { padding: 20px; }
    a { color: #0066cc; }
    .toc, .callout, .feature-card, .contact-box { border-color: #999; background: #f5f5f5; }
  }
</style>
</head>
<body>

<div class="wood-frame-top"></div>
<div class="wood-frame-bottom"></div>

<div class="container">

  <header>
    <div class="orbit-decoration">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="60" rx="55" ry="22" stroke="#c9c8ba" stroke-width="1" opacity="0.5" transform="rotate(0 60 60)"/>
        <ellipse cx="60" cy="60" rx="40" ry="16" stroke="#c9c8ba" stroke-width="1" opacity="0.6" transform="rotate(60 60 60)"/>
        <ellipse cx="60" cy="60" rx="26" ry="10" stroke="#e8c88a" stroke-width="1" opacity="0.7" transform="rotate(120 60 60)"/>
        <circle cx="115" cy="60" r="2.5" fill="#e8c88a"/>
        <circle cx="40" cy="74" r="2" fill="#c9c8ba" opacity="0.8"/>
        <circle cx="72" cy="38" r="2" fill="#c9c8ba" opacity="0.8"/>
      </svg>
      <div class="orbit-center"></div>
    </div>
    <h1>فلك · Falak</h1>
    <p class="tagline">﴿كُلٌّ فِي فَلَكٍ يَسْبَحُونَ﴾</p>
    <p class="subtitle" id="header-subtitle">سياسة الخصوصية وشروط الاستخدام — Privacy Policy & Terms of Use</p>
  </header>

  <div class="lang-toggle" role="tablist" aria-label="Language">
    <button id="btn-ar" class="active" onclick="setLang('ar')" role="tab" aria-selected="true">العربية</button>
    <button id="btn-en" onclick="setLang('en')" role="tab" aria-selected="false">English</button>
  </div>

  <!-- ================= ARABIC ================= -->
  <main class="lang-content active" id="content-ar" dir="rtl" lang="ar">

    <div class="toc">
      <h2>المحتويات</h2>
      <ol>
        <li><a href="#ar-privacy">سياسة الخصوصية</a></li>
        <li><a href="#ar-terms">شروط الاستخدام</a></li>
        <li><a href="#ar-contact">التواصل</a></li>
      </ol>
