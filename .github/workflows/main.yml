    <section id="en-privacy">
      <h2 class="section-title">Privacy Policy</h2>

      <h3>1. Introduction</h3>
      <p><strong>Falak</strong> is built local-first. Your notes, tasks, links, files, and orbital classifications stay on your device by default. No ads, no trackers, no selling of personal data.</p>

      <h3>2. Data We Process</h3>
      <ul>
        <li><strong>Your content:</strong> notes, tasks, ideas, URLs, files, dates, tags, classifications — stored locally.</li>
        <li><strong>Local operational data:</strong> orbit assignment, reason, suggested next step, settings, in-app usage — processed offline by the heuristic engine.</li>
        <li><strong>Optional AI:</strong> If you connect Gemini, Groq, or Ollama, selected content may be sent to that provider. Ollama local stays on your device/network. Gemini/Groq are external. We show a clear pre-transfer disclosure and require explicit informed consent before sending. We do not control their policies.</li>
        <li><strong>Permissions:</strong> storage/files for file picking, internet for external AI, notifications if enabled. No unnecessary permissions.</li>
        <li><strong>What we do not collect:</strong> location, contacts, camera, microphone, ad IDs, browsing history, tracking data, analytics, or ads by default.</li>
      </ul>

      <h3>3. How We Use Data</h3>
      <p>To classify your materials into orbits, display them in Canvas or List View, enable search/filtering, and improve local stability. We do not use your content for ads or to train our models.</p>

      <h3>4. Optional AI</h3>
      <ul>
        <li>No external AI is enabled automatically.</li>
        <li>Before transfer: disclosure + explicit consent.</li>
        <li>You can refuse, stay local-only, or revoke consent.</li>
        <li>Do not send sensitive data to external providers.</li>
        <li>Data may be processed in other countries depending on the provider.</li>
      </ul>

      <h3>5. Storage & Security</h3>
      <ul>
        <li>Local by default.</li>
        <li>May use OS-level encryption.</li>
        <li>System backups may include Falak data if enabled.</li>
        <li>No system is 100% secure, but we minimize data collection.</li>
      </ul>

      <h3>6. Sharing</h3>
      <p>We do not sell your data. We share only:</p>
      <ol>
        <li>with your consent,</li>
        <li>to comply with legal obligations,</li>
        <li>with AI providers you choose.</li>
      </ol>
      <p>No sharing with advertisers or data brokers.</p>

      <h3>7. Retention & Deletion</h3>
      <ul>
        <li>Deleting an item removes it locally.</li>
        <li>Backups may retain copies until overwritten.</li>
        <li>Uninstalling or using in-app deletion removes local data.</li>
        <li>For data sent to external AI providers, contact that provider.</li>
      </ul>

      <h3>8. Your Rights</h3>
      <p>Depending on your location: access, correction, deletion, withdrawal of consent, objection, restriction, portability. GDPR/UK GDPR and CCPA/CPRA rights apply where relevant. Contact <a href="mailto:privacy@example.com">privacy@example.com</a>.</p>

      <h3>9. Children</h3>
      <p>Not intended for children under 13 (or 16 where applicable). We do not knowingly collect children's data.</p>

      <h3>10. Changes</h3>
      <p>We may update this policy. Continued use means acceptance.</p>
    </section>

